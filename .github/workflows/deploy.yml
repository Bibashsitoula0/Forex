name: Deploy

# Runs on the self-hosted runner installed on the VPS itself (see deploy
# runbook). The runner polls GitHub for jobs, so no inbound port on the VPS
# is needed for deployment.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Restart backend service
        run: sudo systemctl restart xau-backend
